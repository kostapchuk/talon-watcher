# Конфиг воркера для деплоя из репозитория (Cloudflare Workers Builds).
#
# Важно: когда воркер собирается из Git, привязки и переменные берутся отсюда,
# а не из панели. Что здесь не описано — при деплое пропадёт.
#
# Секретов тут нет и быть не должно: BOT_TOKEN, WEBHOOK_SECRET, BROADCAST_SECRET
# и GH_TOKEN живут в панели (Settings → Variables and Secrets, тип Secret)
# и деплоем не затираются.

name = "talon-watcher-bot"
main = "bot/worker.js"
compatibility_date = "2026-08-01"

# Не секретные настройки — их видно в репозитории, и это нормально
[vars]
OWNER_CHAT_ID = "536541305"
GH_REPO = "kostapchuk/talon-watcher"

# Хранилище: подписчики, их слежки и состояние каждой слежки.
# Другого хранилища у проекта нет — проверялка в Actions ничего не помнит.
# id — идентификатор namespace из панели: Storage & Databases → KV
[[kv_namespaces]]
binding = "SUBS"
id = "7be5d358416e4f57bad4bd268ad85881"

# Единственное расписание проекта: воркер раз в 15 минут просит GitHub
# запустить проверку. Своего крона у воркфлоу нет — у Cloudflare время точное.
[triggers]
crons = ["*/15 * * * *"]
