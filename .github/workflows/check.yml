# Проверка записи к врачам в GitHub Actions — работает независимо от
# домашнего компьютера.
#
# Джоба ничего не хранит: список слежек и их состояние живут в KV у бота,
# сюда они приезжают по HTTP и туда же уезжают. Поэтому и коммитить нечего,
# и права на запись в репозиторий не нужны.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   BOT_URL, BROADCAST_SECRET
name: talon-watcher

on:
  schedule:
    - cron: "*/5 * * * *"    # родное расписание GitHub: ненадёжное и с задержками,
                             # точность обеспечивает расписание Cloudflare.
                             # Оно же отключится после 60 дней без коммитов
                             # в репозиторий — основного пути это не касается
  repository_dispatch:        # запуск по расписанию Cloudflare и из команды /check
    types: [check]
  workflow_dispatch:          # и кнопка «Run workflow» для проверки вручную
    inputs:
      ping:
        description: "Только проверить связку с ботом (тестовое сообщение)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: talon-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Проверить запись
        env:
          # рассылка идёт через бота на Cloudflare Workers — там же и хранилище
          BOT_URL: ${{ secrets.BOT_URL }}
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          # отчёт владельцу: edit — одно сообщение с временем, every — каждый раз
          HEARTBEAT: ${{ vars.HEARTBEAT || 'edit' }}
          # запасной путь: если бот не настроен, шлём напрямую владельцу
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 check.py --verbose ${{ inputs.ping && '--ping' || '' }}
